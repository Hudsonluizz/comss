# docker-compose.vibe-coding-toolkit.yml
# Para TrueNAS App Center - Colar na UI "Advanced Mode"

version: '3.8'

services:
  vibe-coding-toolkit:
    image: jeanrauwers/vibe-coding-toolkit:latest
    container_name: vibe-coding-toolkit
    networks:
      - jarvis-net
    environment:
      - ALETHEIA_URL=http://truenas.local:3002
      - N8N_URL=http://truenas.local:5678
      - HERMES_URL=http://truenas.local:9119
      - PORT=3000
      - NODE_ENV=production
      - TZ=Europe/Lisbon
    ports:
      - "192.168.1.103:3005:3000"
    volumes:
      - /mnt/Main Pool/Data/vibe-coding-toolkit:/app/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 256M
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  jarvis-net:
    external: true
    name: jarvis-net
